name: Flutter CI

on:
  push:
    branches: [main, develop]
    paths: ['frontend/**', '.github/workflows/flutter-ci.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/flutter-ci.yml']

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.6
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

